name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv per matrix entry: `--system` targets the runner's own Python,
      # which is externally managed and rejects the install.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Smoke test the CLI
        run: |
          uv run dolmen new /tmp/smoke
          uv run dolmen build --source /tmp/smoke --strict
          test -f /tmp/smoke/_site/index.html
