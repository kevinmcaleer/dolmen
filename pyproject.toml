[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: PyPI already has a `dolmen` (a dormant cromlech/dolmen namespace
# package), so the *distribution* is `dolmen-ssg`. The import package and the
# CLI are both `dolmen`.
name = "dolmen-ssg"
version = "0.1.0"
description = "A Jekyll-compatible static site generator written in Python, with a web front end for building the site."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kevin McAleer", email = "kevinmcaleer@gmail.com" }]
keywords = ["static-site-generator", "jekyll", "markdown", "jinja2"]

dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "Pygments>=2.17",
    "click>=8.1",
    "watchfiles>=0.21",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
dolmen = "dolmen.cli:main"

[project.urls]
Homepage = "https://github.com/kevinmcaleer/dolmen"

# Third-party plugins advertise themselves in this entry-point group; see
# dolmen/plugins.py for the hook protocol.
[project.entry-points."dolmen.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/dolmen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
